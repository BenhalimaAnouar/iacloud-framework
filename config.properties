## ==========================================================
## IA-Cloud Adaptive Load Balancing Configuration
## ==========================================================
## This file defines the IA-Cloud API endpoints, authentication,
## QoS requirements, adaptive thresholds, and customized prediction
## options.
## ==========================================================


## ----------------------------------------------------------
## 1. IA-Cloud API Endpoints
## ----------------------------------------------------------
## Standard prediction endpoint.
## Used when: use_allowed_algorithms=no

api=https://iacloudac.ma/api/predictLb


## Customized prediction endpoint.
## Used when: use_allowed_algorithms=yes

customized_api=https://iacloudac.ma/api/predictCustumizedLb


## ----------------------------------------------------------
## 2. API Authentication
## ----------------------------------------------------------
## API Key generated from the IA-Cloud platform.
## Do not expose your production API key in public repositories.

api_key=pk_live_nlKn4wYAMKWir4nQiCbzrGE3tvVJUKa4


## ----------------------------------------------------------
## 3. Initial QoS Requirements
## ----------------------------------------------------------
## Possible values:
## yes = the QoS criterion is required
## no  = the QoS criterion is not required
##
## These values are converted into a binary array:
## yes -> 1
## no  -> 0
##
## Example:
## Performance=yes becomes 1
## Throughtput=no becomes 0

Performance=yes
Throughtput=no
Overhead=yes
Tolerant=yes
MigrationTime=yes
ResponseTime=yes
RessourceUtilization=no
Scalability=yes
PowerSaving=no


## ----------------------------------------------------------
## 4. Adaptive Monitoring Thresholds
## ----------------------------------------------------------
## These values are used during simulation runtime.
## When a threshold is exceeded, the AdaptiveBroker may request
## a new prediction and switch the load balancing policy.

## Maximum tolerated violations before adaptation
toleranceMax=2

## Deadline threshold for cloudlet execution
deadline=1000

## Accepted tolerance after the deadline
tolerance=100

## Maximum execution time
timeMax=10000

## Throughput threshold
throughputMax=0.00002

## Maximum accepted average response time
responseTimeMAX=0.4

## Maximum accepted CPU utilization percentage
ressourceCpuMax=80


## ----------------------------------------------------------
## 5. Customized Prediction Mode
## ----------------------------------------------------------
## use_allowed_algorithms=no
## The framework sends only:
## {
##   "array_param": [...]
## }
##
## use_allowed_algorithms=yes
## The framework sends:
## {
##   "array_param": [...],
##   "allowed_algorithms": [...]
## }
##
## When enabled, the customized_api endpoint is used.

use_allowed_algorithms=no


## ----------------------------------------------------------
## 6. Allowed Algorithms
## ----------------------------------------------------------
## This parameter is used only when:
## use_allowed_algorithms=yes
##
## Write algorithm names separated by commas.
##
## Example:
## allowed_algorithms=FAMLB,CARTON,AntColony,DynamicRR,OLB+LBMM,Min-Min,CLBVM,HoneyBeeForaging

allowed_algorithms=PALB,CARTON


## ==========================================================
## End of IA-Cloud Configuration
## ==========================================================